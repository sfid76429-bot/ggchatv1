name = "guild-chat"
main = "worker/index.ts"
compatibility_date = "2026-09-30"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "./dist/public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/guild-api/*"]

[[d1_databases]]
binding = "DB"
database_name = "guild-chat"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "CHAT_ROOMS"
class_name = "GroupChatRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GroupChatRoom"]
openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Handle-based account access
  - name: groups
    description: Membership-scoped group chat
  - name: community
    description: Public community activity
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/signup:
    post:
      operationId: signUp
      tags: [auth]
      summary: Create an account with a unique handle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignUpInput"
      responses:
        "201":
          description: Account created and signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "409":
          description: Handle is already taken
  /auth/login:
    post:
      operationId: logIn
      tags: [auth]
      summary: Sign in with a handle and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid handle or password
  /auth/logout:
    post:
      operationId: logOut
      tags: [auth]
      summary: End the current session
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResponse"
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the signed-in profile
      responses:
        "200":
          description: Current account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Not signed in
  /community/summary:
    get:
      operationId: getCommunitySummary
      tags: [community]
      summary: Get community-wide totals
      responses:
        "200":
          description: Community overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunitySummary"
  /groups/mine:
    get:
      operationId: listMyGroups
      tags: [groups]
      summary: List groups the signed-in user belongs to
      responses:
        "200":
          description: Member groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GroupSummary"
        "401":
          description: Not signed in
  /groups/discover:
    get:
      operationId: discoverGroups
      tags: [groups]
      summary: Search and rank discoverable groups by membership and activity
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 80
      responses:
        "200":
          description: Discoverable groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GroupSummary"
  /groups:
    post:
      operationId: createGroup
      tags: [groups]
      summary: Create a group and become its first member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGroupInput"
      responses:
        "201":
          description: Created group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupSummary"
        "401":
          description: Not signed in
  /groups/join:
    post:
      operationId: joinGroup
      tags: [groups]
      summary: Join a discoverable group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinGroupInput"
      responses:
        "200":
          description: Joined group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupSummary"
        "401":
          description: Not signed in
        "404":
          description: Group not found
  /groups/messages:
    get:
      operationId: listGroupMessages
      tags: [groups]
      summary: List messages in a group the user belongs to
      parameters:
        - name: groupId
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Recent group messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatMessage"
        "401":
          description: Not signed in or not a group member
        "404":
          description: Group not found
    post:
      operationId: sendGroupMessage
      tags: [groups]
      summary: Send a message to a group the user belongs to
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageInput"
      responses:
        "201":
          description: Sent group message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessage"
        "401":
          description: Not signed in or not a group member
        "404":
          description: Group not found
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    SignUpInput:
      type: object
      properties:
        handle:
          type: string
          minLength: 3
          maxLength: 24
          pattern: "^[a-zA-Z0-9_]+$"
        displayName:
          type: string
          minLength: 1
          maxLength: 40
        password:
          type: string
          minLength: 12
          maxLength: 128
      required: [handle, displayName, password]
    LoginInput:
      type: object
      properties:
        handle:
          type: string
          minLength: 3
          maxLength: 24
        password:
          type: string
          minLength: 1
          maxLength: 128
      required: [handle, password]
    UserProfile:
      type: object
      properties:
        id: { type: string }
        handle: { type: string }
        displayName: { type: string }
        createdAt: { type: string, format: date-time }
      required: [id, handle, displayName, createdAt]
    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/UserProfile"
      required: [user]
    LogoutResponse:
      type: object
      properties:
        ok: { type: boolean }
      required: [ok]
    CommunitySummary:
      type: object
      properties:
        groupCount: { type: integer }
        memberCount: { type: integer }
        activeGroupCount: { type: integer }
      required: [groupCount, memberCount, activeGroupCount]
    GroupSummary:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        category: { type: string }
        memberCount: { type: integer }
        activeCount: { type: integer }
        isMember: { type: boolean }
        lastMessage: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
      required:
        [id, name, description, category, memberCount, activeCount, isMember, lastMessage, createdAt]
    CreateGroupInput:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 48 }
        description: { type: string, minLength: 1, maxLength: 180 }
        category: { type: string, minLength: 1, maxLength: 32 }
      required: [name, description, category]
    JoinGroupInput:
      type: object
      properties:
        groupId: { type: string, minLength: 1 }
      required: [groupId]
    SendMessageInput:
      type: object
      properties:
        groupId: { type: string, minLength: 1 }
        content: { type: string, minLength: 1, maxLength: 2000 }
      required: [groupId, content]
    ChatMessage:
      type: object
      properties:
        id: { type: string }
        groupId: { type: string }
        userId: { type: string }
        handle: { type: string }
        displayName: { type: string }
        content: { type: string }
        createdAt: { type: string, format: date-time }
      required: [id, groupId, userId, handle, displayName, content, createdAt]

